name: Build Best50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - config.json
      - .github/workflows/build.yml
      - tests/test_primary_pipeline.py
      - tests/test_source_discovery.py
      - tests/test_local_feedback.py
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: best50-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Retrieve authoritative local availability feedback
        shell: bash
        run: |
          set -euo pipefail
          if timeout --kill-after=5s 45s git fetch --no-tags origin \
            regional:refs/remotes/origin/regional >/dev/null 2>&1; then
            echo "Regional feedback is available; the builder validates its policy and freshness."
          else
            echo "Regional feedback is unavailable; primary validation continues without local ranking hints."
          fi

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Restore discovery reputation and backoff
        uses: actions/cache/restore@v4
        with:
          path: output/discovery-state.json
          key: discovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discovery-v1-

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update local GeoIP database
        run: |
          set -euo pipefail
          python scripts/update_geoip.py

      - name: Install pinned, verified sing-box
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.13.19"
          # SHA256 from the official GitHub release asset digest.
          SHA256="ef88a9e577d474210867bd708933d042e9b70106529df2656182c9db90106aa1"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-max-time 90 \
            --connect-timeout 15 --max-time 60 \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tgz
          echo "${SHA256}  /tmp/sing-box.tgz" | sha256sum --check --strict
          tar -xzf /tmp/sing-box.tgz -C /tmp
          sudo install "/tmp/sing-box-${VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Run regression tests with the real proxy engine
        run: python -m unittest discover -s tests -v

      - name: Build Best50
        run: |
          set -euo pipefail
          echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          timeout --signal=INT --kill-after=15s 5400 python -u scripts/build.py

      - name: Persist discovery state after success or failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/discovery-state.json
          key: discovery-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate fresh, nonempty publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          from scripts.build import parse_vless
          status = json.loads(Path("output/status.json").read_text())
          generated = int(status.get("generated_at", 0))
          if generated < int(os.environ["BUILD_STARTED_AT"]) or generated > time.time() + 60:
              raise SystemExit("Refusing stale Best50 output")
          published = status.get("published", {})
          for name, limit in (("qualified-all", 500), ("best20", 20), ("best50", 50), ("best100", 100)):
              lines = [line for line in Path(f"output/{name}.txt").read_text().splitlines() if line and not line.startswith("#")]
              if not 1 <= len(lines) <= limit:
                  raise SystemExit(f"Invalid {name} count: {len(lines)}")
              for line in lines:
                  parse_vless(line)
              key = "qualified_all" if name == "qualified-all" else name
              if len(lines) != published.get(key):
                  raise SystemExit(f"Count mismatch for {name}")
          if published["qualified_all"] != status.get("final_stable"):
              raise SystemExit("Qualified pool does not match current successful validation")
          print("Fresh validated publication:", published)
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "best50-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUILD_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$BUILD_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during validation; preserving published output until the next build."
            exit 0
          fi
          git add output/qualified-all.txt output/best20.txt output/best50.txt \
            output/best100.txt output/status.json output/history.json
          if git diff --cached --quiet; then
            echo "Generated output is unchanged."
            exit 0
          fi
          git commit -m "chore: update Best50 subscription"
          # Explicit, non-forced push is atomic at the Git branch. A concurrent
          # main update is never overwritten. Retry only temporary transport errors.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then exit 0; fi
            if [ "$(git rev-parse origin/main)" != "$BUILD_SHA" ]; then
              echo "Concurrent publication won; next scheduled build will refresh."
              exit 0
            fi
            sleep "$((attempt * attempt * 5))"
          done
          echo "Publication failed after bounded retries; previous remote output is preserved."
          exit 1
