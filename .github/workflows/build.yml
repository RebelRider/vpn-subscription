name: Build Best50

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: best50-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update local GeoIP database
        run: |
          set -euo pipefail
          python scripts/update_geoip.py

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.13.19"

          curl -fsSL \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tgz

          tar -xzf /tmp/sing-box.tgz -C /tmp

          sudo install \
            "/tmp/sing-box-${VERSION}-linux-amd64/sing-box" \
            /usr/local/bin/sing-box

          sing-box version

      - name: Build Best50
        run: |
          set -euo pipefail
          python -u scripts/build.py

      - name: Validate published subscription
        shell: bash
        run: |
          set -euo pipefail

          test -s output/qualified-all.txt
          test -s output/best50.txt
          test -s output/status.json

          COUNT=$(grep -c '^vless://' output/best50.txt || true)
          QUALIFIED_COUNT=$(grep -c '^vless://' output/qualified-all.txt || true)

          echo "Published Best50 configurations: ${COUNT}"
          echo "Published qualified pool: ${QUALIFIED_COUNT}"

          if [ "$COUNT" -lt 20 ]; then
            echo "ERROR: Best50 subscription contains fewer than 20 VLESS nodes."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("output/status.json", "r") as f:
              status = json.load(f)

          published = status.get("published", {})

          print("Published:", published)

          qualified_all = published.get(
              "qualified_all",
              0,
          )

          if qualified_all < 20:
              raise SystemExit(
                  "ERROR: status.json reports fewer than "
                  "20 globally qualified nodes."
              )

          if qualified_all != status.get(
              "final_stable",
              0,
          ):
              raise SystemExit(
                  "ERROR: qualified_all does not match "
                  "final_stable."
              )

          if published.get("best50", 0) < 20:
              raise SystemExit(
                  "ERROR: status.json reports fewer than 20 Best50 nodes."
              )
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "best50-bot"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # The build can take 30+ minutes. Never publish output generated
          # from a repository state that is no longer the current main.
          BUILD_SHA="$(git rev-parse HEAD)"

          git fetch origin main

          REMOTE_SHA="$(git rev-parse origin/main)"

          echo "Build base:  ${BUILD_SHA}"
          echo "Remote main: ${REMOTE_SHA}"

          if [ "${BUILD_SHA}" != "${REMOTE_SHA}" ]; then
            echo "STALE BUILD: main changed while this run was testing nodes."
            echo "Generated output will not be published."
            exit 0
          fi

          git add \
            output/qualified-all.txt \
            output/best20.txt \
            output/best50.txt \
            output/best100.txt \
            output/status.json \
            output/history.json

          if git diff --cached --quiet; then
            echo "No changes in generated output."
            exit 0
          fi

          git commit \
            -m "chore: update Best50 subscription"

          # Use an explicit refspec. If main changes in the tiny interval
          # between the stale check and push, Git rejects the push safely
          # instead of overwriting newer history.
          git push origin HEAD:main
